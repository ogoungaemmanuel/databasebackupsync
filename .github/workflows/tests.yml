name: Tests

on:
  push:
    branches: [main, master]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md']
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            laravel: '^8.83'
            testbench: '^5.0'
            phpunit: '^9.6'
          - php: '8.1'
            laravel: '^9.0'
            testbench: '^6.23'
            phpunit: '^9.6'
          - php: '8.2'
            laravel: '^10.0'
            testbench: '^7.0'
            phpunit: '^9.6|^10.5'
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^8.0'
            phpunit: '^10.5'
          - php: '8.3'
            laravel: '^12.0'
            testbench: '^9.0'
            phpunit: '^10.5|^11.0'
          - php: '8.4'
            laravel: '^13.0'
            testbench: '^10.0'
            phpunit: '^11.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, xml, sqlite3, pdo_sqlite, openssl, zip, gd
          coverage: xdebug
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "phpunit/phpunit:${{ matrix.phpunit }}" \
            --no-interaction --no-progress --prefer-dist

      - name: Lint PHP sources
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run test suite
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  static-analysis:
    name: PHPStan (level 6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHPStan
        run: |
          composer require --dev phpstan/phpstan --no-interaction --no-progress
          vendor/bin/phpstan analyse src --level=6 --no-progress
